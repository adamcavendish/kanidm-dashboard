name: Container Image

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to publish. Defaults to sha-<commit>.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, publish, and smoke image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install openapi-nexus
        run: cargo binstall --no-confirm --force openapi-nexus@0.1.13

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just generate-sdk

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Resolve image reference
        id: image
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_IMAGE_TAG}" ]; then
            tag="${INPUT_IMAGE_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag="latest"
          else
            tag="sha-${GITHUB_SHA::12}"
          fi
          if ! [[ "${tag}" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "Invalid image tag: ${tag}" >&2
            exit 1
          fi
          echo "ref=ghcr.io/${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - run: just install
      - run: vp exec playwright install --with-deps chromium
      - run: just check
      - run: just test
      - run: just build
      - run: just audit
      - run: just container-smoke

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ghcr.io/${{ github.repository }}:latest

      - name: Pull and smoke published image
        env:
          KANIDM_DASHBOARD_IMAGE: ${{ steps.image.outputs.ref }}
        run: just container-smoke
