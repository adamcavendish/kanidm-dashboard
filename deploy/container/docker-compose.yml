# Example: deploy kanidm-dashboard alongside a Kanidm server.
#
# The dashboard container proxies Kanidm API routes internally and serves
# the admin UI + self-service portal. Only port 8080 needs to be exposed
# to your reverse proxy (Caddy, nginx, etc.).
#
# Prerequisites:
#   - A running Kanidm server (e.g. kanidm/server:1.10.3)
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#
# Image tags:
#   :latest  — always pulls the newest release (auto-update on restart)
#   :0.0.2   — pin to a specific version (recommended for production)
#
# TLS notes:
#   The dashboard uses Caddy's system trust store for HTTPS connections
#   to Kanidm. If Kanidm uses a self-signed certificate, mount a custom
#   Caddyfile with tls_trusted_ca_certs or tls_insecure_skip_verify:
#
#     volumes:
#       - ./my-caddyfile:/etc/caddy/Caddyfile:ro

services:
  kanidm:
    image: kanidm/server:1.10.3
    container_name: kanidm
    restart: unless-stopped
    volumes:
      - ./server.toml:/data/server.toml:ro
      - ./db:/data/db
      - ./certs:/data/certs:ro
      - ./backups:/data/backups
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      - kanidm

  dashboard:
    # Change :latest to a version tag (e.g. :0.0.2) to pin for production
    image: ghcr.io/adamcavendish/kanidm-dashboard:latest
    container_name: kanidm-dashboard
    restart: unless-stopped
    environment:
      # Kanidm upstream URL (must be reachable from the dashboard container)
      KANIDM_UPSTREAM: https://kanidm:8443
    # Customise the sign-in page title via a config file:
    #   echo '{"siteName":"My Org","dataSource":{"mode":"kanidm","apiBasePath":""}}' > dashboard.config.json
    #   Uncomment the volume below and recreate the container.
    # volumes:
    #   - ./dashboard.config.json:/config/dashboard.config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - kanidm

networks:
  kanidm:
    driver: bridge
